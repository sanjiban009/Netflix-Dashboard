<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETFLIX</title><style>
*{box-sizing:border-box}body{margin:0;background:#101115;color:#f1f2f5;font:15px system-ui}header,main{max-width:1440px;margin:auto;padding:24px 42px}header{display:flex;justify-content:space-between;border-bottom:1px solid #333}b.mark{color:#ff4655;letter-spacing:3px}small,p,label{color:#b9bac5}h1{font-size:clamp(34px,5vw,58px);margin:8px 0}h2{margin:0 0 13px}.filters,.kpis,.charts{display:grid;gap:12px;margin:20px 0}.filters,.kpis{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(6,1fr)}button,select,.box{border:1px solid #34353e;border-radius:10px;background:#1b1c23;color:#fff;padding:13px}button{cursor:pointer}.active{background:#bc182b}select{width:100%;margin-top:5px}.box{padding:22px}.kpis strong{display:block;font-size:27px;margin:8px 0}.charts{grid-template-columns:1.3fr 1fr}.insight{border-left:4px solid #ff4655;background:#251a23}.barrow{display:grid;grid-template-columns:80px 1fr 105px;align-items:center;gap:9px;margin:10px 0}.bar{height:12px;background:#38303b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a11931,#ff606b)}table{width:100%;border-collapse:collapse}td,th{padding:11px;text-align:left;border-bottom:1px solid #333}.scroll{overflow:auto}.red{color:#ff7580}.label{letter-spacing:2px;text-transform:uppercase;font-size:11px}@media(max-width:850px){header,main{padding:17px}.filters,.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.barrow{grid-template-columns:66px 1fr 92px}}
body{padding-left:248px}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#17181e;border-right:1px solid #34353e;padding:25px 16px;overflow:auto;z-index:2}.sidebar a{display:block;color:#ff5967;text-decoration:none;font-weight:800;letter-spacing:2px}.sidebar nav{display:grid;gap:8px;margin:18px 0}.sidebar button{text-align:left;width:100%;display:flex;align-items:center;gap:10px}.sidebar button span{opacity:.7;font-size:12px}.sidebar :focus-visible{outline:2px solid #ff8490;outline-offset:2px}

</style><aside class="sidebar"><a href="index.html">NETFLIX</a><p class="label desktop-label">Dashboard pages</p><nav id="nav" aria-label="Dashboard pages"></nav></aside><header><b class="mark">NETFLIX</b><small>INDEPENDENT NETFLIX CASE STUDY • INDIA</small></header><main><small class="label red">Streaming analytics / Executive reporting</small><h1 id="title"></h1><p id="sub"></p><div class="filters" id="filters"></div><small id="period"></small><div class="kpis" id="kpis"></div><div class="box insight"><small class="label red">Dynamic insight</small><p id="insight"></p><div id="actions"></div></div><div class="charts"><section class="box"><h2 id="trendtitle"></h2><div id="trend"></div></section><section class="box"><h2 id="ranktitle"></h2><div id="rank"></div></section></div><section class="box scroll"><h2>Segment detail</h2><table id="detail"></table></section><p>Synthetic monthly aggregates for portfolio demonstration. Independent project; no affiliation with Netflix. No actual Netflix metrics.</p></main><script src="data.js"></script><script>
const rows=RAW.trim().split('\n').slice(1).map(s=>{let [date,region,plan,genre,...v]=s.split(',');let [y,m]=date.split('-').map(Number);return {date,region,plan,genre,fy:y-(m<4),fm:(m+8)%12,...Object.fromEntries(['starts','completions','hours','spend'].map((k,i)=>[k,+v[i]]))}});
const pages=[['Executive overview','Streaming demand and regional performance','starts','region','Play starts'],['Audience engagement','Completion and viewing depth by plan','rate','plan','Completion rate'],['Content performance','Viewing demand across genres','hours','genre','Watch hours'],['Content efficiency','Content spend per watch hour by genre','cost','genre','Spend / watch hour']];
let page=Math.max(0,Math.min(3,+new URLSearchParams(location.search).get('page')||0));
const $=id=>document.getElementById(id), n=new Intl.NumberFormat('en-IN',{maximumFractionDigits:1}),fy=y=>'FY '+y+'–'+String(y+1).slice(-2);
const num=x=>x===null?'—':n.format(x), compact=x=>x>=1e7?n.format(x/1e7)+' Cr':x>=1e5?n.format(x/1e5)+' L':num(x);
const sums=d=>d.reduce((a,r)=>({starts:a.starts+r.starts,completions:a.completions+r.completions,hours:a.hours+r.hours,spend:a.spend+r.spend}),{starts:0,completions:0,hours:0,spend:0});
const metric=(a,k)=>k==='rate'?(a.starts?100*a.completions/a.starts:null):k==='cost'?(a.hours?a.spend/a.hours:null):a[k];
const fmt=(v,k)=>v===null?'—':k==='rate'?num(v)+'%':k==='cost'?'₹'+num(v):compact(v);
const opts=(id,label,vals,f)=>'<label>'+label+'<select id="'+id+'">'+vals.map(v=>'<option value="'+v+'">'+(f?f(v):v)+'</option>').join('')+'</select></label>';
const uniq=k=>[...new Set(rows.map(r=>r[k]))];
$('filters').innerHTML=opts('fy','Financial year',uniq('fy').reverse(),fy)+opts('mode','Period',['FYTD','Full FY'])+opts('cut','FYTD through',['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'])+['region','plan','genre'].map(k=>opts(k,k[0].toUpperCase()+k.slice(1),['All',...uniq(k)])).join('');
$('cut').selectedIndex=6;$('filters').onchange=render;
function nav(i){page=i;render();globalThis.window?.scrollTo(0,0)}
function render(){
 const [title,sub,key,dim,label]=pages[page];
 $('title').textContent=title;$('sub').textContent=sub;
 $('nav').innerHTML=pages.map(([t],i)=>'<button class="'+(i===page?'active':'')+'" aria-current="'+(i===page?'page':'false')+'" onclick="nav('+i+')"><span>'+String(i+1).padStart(2,'0')+'</span>'+t+'</button>').join('');
 let y=+$('fy').value,full=$('mode').value==='Full FY', avail=Math.max(...rows.filter(r=>r.fy===y).map(r=>r.fm)), cut=Math.min(avail,full?11:$('cut').selectedIndex), months=[...$('cut').options].map(x=>x.text);
 $('cut').disabled=full;
 const matches=r=>['region','plan','genre'].every(k=>$(k).value==='All'||r[k]===$(k).value);
 let a=rows.filter(r=>r.fy===y&&r.fm<=cut&&matches(r)),b=rows.filter(r=>r.fy===y-1&&r.fm<=cut&&matches(r)),A=sums(a),B=sums(b),v=metric(A,key),p=metric(B,key);
 $('period').textContent=fy(y)+' • Apr–'+months[cut]+' • '+(full&&cut<11?'Partial FY: latest available month':full?'Full FY':'FYTD')+' • Prior year uses the same months'+(!b.length?' (unavailable)':'');
 $('kpis').innerHTML=[['Play starts',compact(A.starts)],['Completion rate',fmt(metric(A,'rate'),'rate')],['Watch hours',compact(A.hours)],['Allocated content spend','₹'+compact(A.spend)]].map(([t,v])=>'<div class="box"><small>'+t+'</small><strong>'+v+'</strong></div>').join('');
 let groups=uniq(dim).filter(g=>a.some(r=>r[dim]===g)).map(g=>[g,sums(a.filter(r=>r[dim]===g))]).sort((a,b)=>key==='cost'?metric(a[1],key)-metric(b[1],key):metric(b[1],key)-metric(a[1],key));
 let trend=months.slice(0,cut+1).map((m,i)=>[m,metric(sums(a.filter(r=>r.fm===i)),key)]);
 function bars(d){let max=Math.max(1,...d.map(x=>x[1]||0));return d.map(([t,v])=>'<div class="barrow"><small>'+t+'</small><div class="bar"><i style="width:'+100*(v||0)/max+'%"></i></div><b>'+fmt(v,key)+'</b></div>').join('')}
 let change=!b.length||p===null||!p?'No prior-period comparison is available.':key==='rate'?'Year-on-year movement: '+num(v-p)+' percentage points.':'Year-on-year movement: '+num(100*(v/p-1))+'%.';
 $('insight').textContent=label+' for this selection: '+fmt(v,key)+'. '+change+' '+(groups.length?(key==='cost'?'Lowest spend per hour: ':'Leading '+dim+': ')+groups[0][0]+' ('+fmt(metric(groups[0][1],key),key)+').':'');
 const priorFor=g=>metric(sums(b.filter(r=>r[dim]===g)),key);
 const spread=groups.length>1?Math.abs(metric(groups[0][1],key)-metric(groups.at(-1)[1],key)):null;
 const tail=groups.at(-1), lead=groups[0];
 const periodMove=trend.length>1&&trend.at(-2)[1]>0?(key==='rate'?num(trend.at(-1)[1]-trend.at(-2)[1])+' pp':num(100*(trend.at(-1)[1]/trend.at(-2)[1]-1))+'%'):null;
 let next='';
 if(page===0)next=groups.length>1?'Compare the play-start mix in '+tail[0]+' with '+lead[0]+' by plan and genre. Check matched FYTD before deciding where to test a campaign.':'Split this selection by plan and genre to see which segments account for most play starts.';
 if(page===1)next='Review '+tail[0]+' by genre and month. Check play-start volume before prioritising a completion drop; compare short and long formats only if runtime data becomes available.';
 if(page===2)next='Review '+lead[0]+' completion and spend per watch hour before proposing more content. Check whether the demand holds across regions and plans.';
 if(page===3)next='Review the spend allocation and watch-hour denominator for '+tail[0]+'. Compare engagement and reach before shifting budget; spend per hour alone does not measure profitability.';
 const topPrior=priorFor(lead[0]);
 const driver=page===0?num(100*lead[1].starts/A.starts)+'% of selected starts':page===1?compact(tail[1].starts)+' starts in '+tail[0]:page===2?num(100*lead[1].hours/A.hours)+'% of selected watch hours':fmt(metric(tail[1],key),key)+' in '+tail[0];
 $('actions').innerHTML='<p><b>Decision signal:</b> '+driver+'. '+(spread===null?'One segment selected.':'Segment spread: '+(key==='rate'?num(spread)+' pp':fmt(spread,key))+'.')+(b.length&&topPrior!==null?' '+lead[0]+' matched prior FYTD: '+fmt(topPrior,key)+'.':'')+(periodMove?' Latest month vs preceding month: '+periodMove+'.':'')+'</p><p><b>Recommended next action:</b> '+next+'</p>';
 $('trendtitle').textContent=label+' by month';$('ranktitle').textContent=label+' by '+dim;$('trend').innerHTML=bars(trend);$('rank').innerHTML=bars(groups.map(([g,s])=>[g,metric(s,key)]));
 $('detail').innerHTML='<tr><th>Segment</th><th>Starts</th><th>Completion</th><th>Hours</th><th>Spend</th><th>Spend / hour</th></tr>'+groups.map(([g,s])=>'<tr>'+[g,compact(s.starts),fmt(metric(s,'rate'),'rate'),compact(s.hours),'₹'+compact(s.spend),fmt(metric(s,'cost'),'cost')].map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');
}render();
</script></html>
